# Thiqa AI: keep this fork current with elie222/rakazo.
# Weekly (and on demand) it merges upstream/main into a branch and opens a PR into main.
# A clean merge is merged automatically; a conflicting one is left open for a person to resolve.
# Thiqa's own changes should stay additive (new files, config) so most weeks merge cleanly.
name: thiqa-sync-upstream

on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: thiqa-sync-upstream
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Merge upstream into a sync branch
        id: merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "thiqa-sync"
          git config user.email "thiqa-sync@users.noreply.github.com"
          git remote add upstream https://github.com/elie222/rakazo.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Already up to date with upstream."; echo "changed=false" >> "$GITHUB_OUTPUT"; exit 0
          fi
          branch="sync/upstream-$(date -u +%Y%m%d)"
          git checkout -b "$branch"
          if git merge --no-edit upstream/main; then
            echo "clean=true" >> "$GITHUB_OUTPUT"
          else
            git merge --abort
            git reset --hard upstream/main
            git merge --no-edit -s ours main || true
            echo "clean=false" >> "$GITHUB_OUTPUT"
          fi
          git push -f origin "$branch"
          echo "branch=$branch" >> "$GITHUB_OUTPUT"
          echo "changed=true" >> "$GITHUB_OUTPUT"
      - name: Open the PR, and merge it when clean
        if: steps.merge.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          branch="${{ steps.merge.outputs.branch }}"
          title="chore(sync): merge upstream Rakazo $(date -u +%Y-%m-%d)"
          if [ "${{ steps.merge.outputs.clean }}" = "true" ]; then
            body="Clean merge of upstream elie222/rakazo main. Merged automatically."
          else
            body="Upstream elie222/rakazo main conflicts with Thiqa changes. Resolve locally: git fetch upstream && git merge upstream/main, then push to this branch."
          fi
          url=$(gh pr create --base main --head "$branch" --title "$title" --body "$body" 2>/dev/null || gh pr view "$branch" --json url --jq .url)
          echo "$url"
          if [ "${{ steps.merge.outputs.clean }}" = "true" ]; then
            gh pr merge "$url" --merge --delete-branch
          fi
